<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 20px 0;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        /* Controls Panel fully separated at the top */
        .panel {
            background-color: #242434;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            position: relative;
            z-index: 10; /* Forces controls to stay on top */
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: #3b3b4f;
            color: white;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            display: block;
        }

        button:hover {
            background-color: #4c4c6d;
        }

        button.active {
            background-color: #007acc !important;
            border-color: #00bfff !important;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background-color: #111116;
            border-radius: 6px;
            border-left: 5px solid #2ecc71;
        }

        .output-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .output-text {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        /* Animation Display Box fully separated at the bottom */
        .display-window {
            background-color: #111116;
            border: 2px solid #3b3b4f;
            border-radius: 8px;
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .wire-container {
            position: absolute;
            left: 50%;
            top: 5%;
            width: 24px;
            height: 90%;
            transform: translateX(-50%);
            overflow: hidden;
            z-index: 2;
        }

        .wire-core {
            position: absolute;
            top: 0;
            left: 6px;
            width: 12px;
            height: 100%;
            background-color: #7f8c8d;
            border-radius: 4px;
        }

        .current-stream {
            position: absolute;
            width: 100%;
            height: 200%;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .current-arrow {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
        }

        .current-arrow.up {
            border-bottom: 25px solid #e74c3c;
        }

        .current-arrow.down {
            border-top: 25px solid #e74c3c;
        }

        @keyframes flowUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes flowDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        .field-grid {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 90%;
            height: 80%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            z-index: 1;
        }

        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .field-symbol {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
            opacity: 0.8;
        }

        .field-line-row {
            position: absolute;
            width: 90%;
            left: 5%;
            height: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1;
        }

        .field-arrow {
            font-size: 22px;
            font-weight: bold;
            color: #3498db;
        }

        @keyframes shiftLeft {
            0% { transform: translateX(20px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-20px); opacity: 0; }
        }

        @keyframes shiftRight {
            0% { transform: translateX(-20px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(20px); opacity: 0; }
        }

        .animate-left { animation: shiftLeft 1.5s infinite linear; }
        .animate-right { animation: shiftRight 1.5s infinite linear; }

        .force-overlay {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 3;
        }

        .visual-badge {
            font-weight: bold;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .badge-current { 
            background-color: #e74c3c; 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 4;
        }
    </style>
</head>
<body>

    <h1>Magnetic Force</h1>

    <div class="container">
        <!-- Control Box Panel at Top -->
        <div class="panel">
            <div class="group">
                <label>1. Current Direction (I)</label>
                <div class="buttons">
                    <button id="btn-up" class="active">↑ UP (Flowing)</button>
                    <button id="btn-down">↓ DOWN (Flowing)</button>
                </div>
            </div>

            <div class="group">
                <label>2. Magnetic Field Direction (B)</label>
                <div class="buttons">
                    <button id="btn-left" class="active">← LEFT</button>
                    <button id="btn-right">→ RIGHT</button>
                    <button id="btn-into">⊗ INTO PLANE</button>
                    <button id="btn-out">⊙ OUT OF PLANE</button>
                </div>
            </div>

            <div class="output">
                <div class="output-title">Direction of Force (F)</div>
                <div class="output-text" id="forceResult">Out of the Page / Forward</div>
            </div>
        </div>

        <!-- Simulation Viewport at Bottom -->
        <div class="display-window">
            <div class="visual-badge badge-current">Wire: Current (I)</div>
            
            <div class="wire-container">
                <div class="wire-core"></div>
                <div id="streamBox" class="current-stream" style="animation: flowUp 1.2s infinite linear;">
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                </div>
            </div>

            <div id="fieldMatrix"></div>
            <div id="forceFeedback" class="force-overlay"></div>
        </div>
    </div>

    <script>
        // Track states directly
        let currentDir = 'up';
        let fieldDir = 'left';

        // Direct ID Targeting for absolute button execution
        document.getElementById('btn-up').onclick = function() {
            currentDir = 'up';
            toggleCurrentActive(this);
            updateCurrentAnimation('up');
            runPhysics();
        };

        document.getElementById('btn-down').onclick = function() {
            currentDir = 'down';
            toggleCurrentActive(this);
            updateCurrentAnimation('down');
            runPhysics();
        };

        document.getElementById('btn-left').onclick = function() {
            fieldDir = 'left';
            toggleFieldActive(this);
            runPhysics();
        };

        document.getElementById('btn-right').onclick = function() {
            fieldDir = 'right';
            toggleFieldActive(this);
            runPhysics();
        };

        document.getElementById('btn-into').onclick = function() {
            fieldDir = 'into';
            toggleFieldActive(this);
            runPhysics();
        };

        document.getElementById('btn-out').onclick = function() {
            fieldDir = 'out';
            toggleFieldActive(this);
            runPhysics();
        };

        function toggleCurrentActive(activeBtn) {
            document.getElementById('btn-up').classList.remove('active');
            document.getElementById('btn-down').classList.remove('active');
