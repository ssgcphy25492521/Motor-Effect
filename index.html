<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        .panel {
            background-color: #242434;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 300px;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: #3b3b4f;
            color: white;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover {
            background-color: #4c4c6d;
        }

        button.active {
            background-color: #007acc;
            border-color: #00bfff;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background-color: #111116;
            border-radius: 6px;
            border-left: 5px solid #2ecc71;
        }

        .output-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .output-text {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        .display-window {
            background-color: #111116;
            border: 2px solid #3b3b4f;
            border-radius: 8px;
            width: 400px;
            height: 400px;
            position: relative;
            overflow: hidden;
        }

        /* Pure CSS Simulation Elements */
        .wire {
            position: absolute;
            left: 50%;
            top: 10%;
            width: 12px;
            height: 80%;
            background-color: #7f8c8d;
            transform: translateX(-50%);
            border-radius: 4px;
            z-index: 1;
        }

        .arrow {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            z-index: 2;
        }

        .arrow-up {
            top: 30%;
            border-bottom: 40px solid #e74c3c;
        }

        .arrow-down {
            bottom: 30%;
            border-top: 40px solid #e74c3c;
        }

        .visual-label {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 3;
        }

        #currentLabel {
            background-color: #e74c3c;
            left: 55%;
        }

        #fieldContainer, #forceContainer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2;
        }
    </style>
</head>
<body>

    <h1>Magnetic Force</h1>

    <div class="container">
        <!-- Configuration Controls -->
        <div class="panel">
            <div class="group">
                <label>1. Current Direction (I)</label>
                <div class="buttons">
                    <button class="active" onclick="updateCurrent('up', this)">↑ UP</button>
                    <button onclick="updateCurrent('down', this)">↓ DOWN</button>
                </div>
            </div>

            <div class="group">
                <label>2. Magnetic Field Direction (B)</label>
                <div class="buttons">
                    <button class="active" onclick="updateField('left', this)">← LEFT</button>
                    <button onclick="updateField('right', this)">→ RIGHT</button>
                    <button onclick="updateField('into', this)">⊗ INTO PLANE</button>
                    <button onclick="updateField('out', this)">⊙ OUT OF PLANE</button>
                </div>
            </div>

            <div class="output">
                <div class="output-title">Direction of Force (F)</div>
                <div class="output-text" id="forceResult">Out of the Page / Forward</div>
            </div>
        </div>

        <!-- Safe Simulation Box -->
        <div class="display-window">
            <!-- Central Wire -->
            <div class="wire"></div>
            <div id="currentArrow" class="arrow arrow-up"></div>
            <div id="currentLabel" class="visual-label" style="top: 45%;">Current (I)</div>

            <!-- Dynamic Vectors Layers -->
            <div id="fieldContainer"></div>
            <div id="forceContainer"></div>
        </div>
    </div>

    <script>
        let currentDir = 'up';
        let fieldDir = 'left';

        function updateCurrent(dir, btn) {
            currentDir = dir;
            clearActive(btn);
            document.getElementById('currentArrow').className = 'arrow arrow-' + dir;
            document.getElementById('currentLabel').style.top = dir === 'up' ? '45%' : '45%';
            runPhysics();
        }

        function updateField(dir, btn) {
            fieldDir = dir;
            clearActive(btn);
            runPhysics();
        }

        function clearActive(clickedBtn) {
            const parent = clickedBtn.parentElement;
            const buttons = parent.getElementsByTagName('button');
            for(let btn of buttons) {
                btn.classList.remove('active');
            }
            clickedBtn.classList.add('active');
        }

        function runPhysics() {
            let force = "";
            let fieldHTML = "";
            let forceHTML = "";

            // Calculate precise physics rules
            if (currentDir === 'up') {
                if (fieldDir === 'left')  force = "Out of the Page / Forward";
                if (fieldDir === 'right') force = "Into the Page / Backward";
                if (fieldDir === 'into')  force = "Left";
                if (fieldDir === 'out')   force = "Right";
            } else {
                if (fieldDir === 'left')  force = "Into the Page / Backward";
                if (fieldDir === 'right') force = "Out of the Page / Forward";
                if (fieldDir === 'into')  force = "Right";
                if (fieldDir === 'out')   force = "Left";
            }

            // Print textual solution directly into UI layout
            document.getElementById('forceResult').textContent = force;

            // Generate Magnetic Field (B) Indicators
            if (fieldDir === 'left') {
                fieldHTML = `
                    <div class="visual-label" style="background:#3498db; left:70%; top:25%;">← B Field</div>
                    <div class="visual-label" style="background:#3498db; left:15%; top:25%;">← B Field</div>
                `;
            } else if (fieldDir === 'right') {
                fieldHTML = `
                    <div class="visual-label" style="background:#3498db; left:70%; top:25%;">B Field →</div>
                    <div class="visual-label" style="background:#3498db; left:15%; top:25%;">B Field →</div>
                `;
            } else if (fieldDir === 'into') {
                fieldHTML = `
                    <div class="visual-label" style="background:#3498db; left:20%; top:25%;">⊗ B (Into Plane)</div>
                    <div class="visual-label" style="background:#3498db; left:60%; top:25%;">⊗ B (Into Plane)</div>
                `;
            } else if (fieldDir === 'out') {
                fieldHTML = `
                    <div class="visual-label" style="background:#3498db; left:20%; top:25%;">⊙ B (Out of Plane)</div>
                    <div class="visual-label" style="background:#3498db; left:60%; top:25%;">⊙ B (Out of Plane)</div>
                `;
            }

            // Generate Force (F) Indicators
            if (force === "Left") {
                forceHTML = `<div class="visual-label" style="background:#2ecc71; left:15%; top:70%;">← Force (F)</div>`;
            } else if (force === "Right") {
                forceHTML = `<div class="visual-label" style="background:#2ecc71; left:65%; top:70%;">Force (F) →</div>`;
            } else if (force.includes("Into the Page")) {
                forceHTML = `<div class="visual-label" style="background:#2ecc71; left:35%; top:70%;">⊗ Force (Into Plane)</div>`;
            } else if (force.includes("Out of the Page")) {
                forceHTML = `<div class="visual-label" style="background:#2ecc71; left:35%; top:70%;">⊙ Force (Out of Plane)</div>`;
            }

            document.getElementById('fieldContainer').innerHTML = fieldHTML;
            document.getElementById('forceContainer').innerHTML = forceHTML;
        }

        // Initialize setup on load
        runPhysics();
    </script>
</body>
</html>
