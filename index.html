<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force on a Wire Simulation</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --text-color: #cdd6f4;
            --current-color: #f38ba8;
            --field-color: #89b4fa;
            --force-color: #a6e3a1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 25px;
            color: #a6adc8;
            font-size: 0.95rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            width: 100%;
        }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-group-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            background-color: #313244;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #45475a;
        }

        button.active[data-type="current"] {
            background-color: rgba(243, 139, 168, 0.2);
            border-color: var(--current-color);
            color: var(--current-color);
        }

        button.active[data-type="field"] {
            background-color: rgba(137, 180, 250, 0.2);
            border-color: var(--field-color);
            color: var(--field-color);
        }

        .output-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #11111b;
            border-radius: 8px;
            border-left: 5px solid var(--force-color);
        }

        .output-label {
            font-size: 0.85rem;
            color: #a6adc8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .output-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--force-color);
        }

        .canvas-container {
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            padding: 15px;
            position: relative;
        }

        canvas {
            background-color: #11111b;
            border-radius: 8px;
            display: block;
        }

        .legend {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <h1>Magnetic Force (\(\vec{F} = I\vec{L} \times \vec{B}\))</h1>
    <div class="subtitle">Interactive 3D Perspective Vector Laboratory</div>

    <div class="container">
        <!-- Controls Left -->
        <div class="control-panel">
            <div class="control-group">
                <label>1. Current Direction (\(I\))</label>
                <div class="btn-group">
                    <button class="active" data-type="current" data-val="up">↑ UP</button>
                    <button data-type="current" data-val="down">↓ DOWN</button>
                </div>
            </div>

            <div class="control-group">
                <label>2. Magnetic Field Direction (\(\vec{B}\))</label>
                <div class="btn-group-4">
                    <button class="active" data-type="field" data-val="left">← LEFT</button>
                    <button data-type="field" data-val="right">→ RIGHT</button>
                    <button data-type="field" data-val="into">⊗ INTO PLANE</button>
                    <button data-type="field" data-val="out">⊙ OUT OF PLANE</button>
                </div>
            </div>

            <div class="output-box">
                <div class="output-label">Resulting Magnetic Force (\(\vec{F}\))</div>
                <div class="output-value" id="forceText">Out of the Page / Forward</div>
            </div>
        </div>

        <!-- Simulation Right -->
        <div class="canvas-container">
            <canvas id="simCanvas" width="500" height="500"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background-color: var(--current-color);"></div> Current (\(I\))
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background-color: var(--field-color);"></div> Magnetic Field (\(\vec{B}\))
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background-color: var(--force-color);"></div> Force (\(\vec{F}\))
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const forceText = document.getElementById('forceText');

        // State variables
        let currentDir = 'up';
        let fieldDir = 'left';

        // 3D Isometric Projection setup
        // Mapping (X, Y, Z) to 2D Canvas pixels (x, y)
        // X goes Right/Left, Y goes Up/Down, Z goes Into/Out of page (diagonal axis)
        const originX = 250;
        const originY = 250;

        function project(x, y, z) {
            // Z axis projects diagonally down-left to simulate depth
            const isoAngle = Math.PI / 6; // 30 degrees
            return {
                x: originX + x - z * Math.cos(isoAngle),
                y: originY - y + z * Math.sin(isoAngle)
            };
        }

        // Configure click event listeners
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = btn.getAttribute('data-type');
                const val = btn.getAttribute('data-val');

                // Toggle active state classes
                document.querySelectorAll(`button[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update system math values
                if (type === 'current') currentDir = val;
                if (type === 'field') fieldDir = val;

                calculatePhysics();
            });
        });

        function calculatePhysics() {
            let forceDirectionDescription = "";

            // Right hand rule calculations evaluated against your corrected matrix
            if (currentDir === 'up') {
                if (fieldDir === 'left')  forceDirectionDescription = "Out of the Page / Forward";
                if (fieldDir === 'right') forceDirectionDescription = "Into the Page / Backward";
                if (fieldDir === 'into')  forceDirectionDescription = "Left";
                if (fieldDir === 'out')   forceDirectionDescription = "Right";
            } else { // Down
                if (fieldDir === 'left')  forceDirectionDescription = "Into the Page / Backward";
                if (fieldDir === 'right') forceDirectionDescription = "Out of the Page / Forward";
                if (fieldDir === 'into')  forceDirectionDescription = "Right";
                if (fieldDir === 'out')   forceDirectionDescription = "Left";
            }

            forceText.textContent = forceDirectionDescription;
            drawSimulation(forceDirectionDescription);
        }

        function drawArrow(ctx, fromX, fromY, fromZ, toX, toY, toZ, color, lineWidth = 4, isDashed = false) {
            const pFrom = project(fromX, fromY, fromZ);
            const pTo = project(toX, toY, toZ);

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            if (isDashed) ctx.setLineDash([4, 4]);
            else ctx.setLineDash([]);
            
            ctx.moveTo(pFrom.x, pFrom.y);
            ctx.lineTo(pTo.x, pTo.y);
            ctx.stroke();
            ctx.setLineDash([]); // Reset line configurations

            // Draw clean arrow heads in 2D space
            const angle = Math.atan2(pTo.y - pFrom.y, pTo.x - pFrom.x);
            ctx.beginPath();
            ctx.fillStyle = color;
