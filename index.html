<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --text-color: #cdd6f4;
            --current-color: #f38ba8;
            --field-color: #89b4fa;
            --force-color: #a6e3a1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 25px;
            color: #a6adc8;
            font-size: 0.95rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            max-width: 1000px;
            width: 100%;
        }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            flex: 1;
            min-width: 300px;
            max-width: 400px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .btn-group, .btn-group-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button {
            background-color: #313244;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #45475a;
        }

        button.active[data-type="current"] {
            background-color: rgba(243, 139, 168, 0.2);
            border-color: var(--current-color);
            color: var(--current-color);
        }

        button.active[data-type="field"] {
            background-color: rgba(137, 180, 250, 0.2);
            border-color: var(--field-color);
            color: var(--field-color);
        }

        .output-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #11111b;
            border-radius: 8px;
            border-left: 5px solid var(--force-color);
        }

        .output-label {
            font-size: 0.85rem;
            color: #a6adc8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .output-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--force-color);
        }

        .canvas-container {
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            padding: 15px;
        }

        canvas {
            background-color: #11111b;
            border-radius: 8px;
            display: block;
        }

        .legend {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <h1>Magnetic Force</h1>
    <div class="subtitle">Interactive 2D Vector Laboratory</div>

    <div class="container">
        <div class="control-panel">
            <div class="control-group">
                <label>1. Current Direction (I)</label>
                <div class="btn-group">
                    <button class="active" data-type="current" data-val="up">↑ UP</button>
                    <button data-type="current" data-val="down">↓ DOWN</button>
                </div>
            </div>

            <div class="control-group">
                <label>2. Magnetic Field (B)</label>
                <div class="btn-group-4">
                    <button class="active" data-type="field" data-val="left">← LEFT</button>
                    <button data-type="field" data-val="right">→ RIGHT</button>
                    <button data-type="field" data-val="into">⊗ INTO PLANE</button>
                    <button data-type="field" data-val="out">⊙ OUT OF PLANE</button>
                </div>
            </div>

            <div class="output-box">
                <div class="output-label">Resulting Magnetic Force (F)</div>
                <div class="output-value" id="forceText">Out of the Page / Forward</div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas" width="400" height="400"></canvas>
            <div class="legend">
                <div class="legend-item"><div class="legend-dot" style="background-color: var(--current-color);"></div> Current</div>
                <div class="legend-item"><div class="legend-dot" style="background-color: var(--field-color);"></div> Field</div>
                <div class="legend-item"><div class="legend-dot" style="background-color: var(--force-color);"></div> Force</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const forceText = document.getElementById('forceText');

        let currentDir = 'up';
        let fieldDir = 'left';

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.getAttribute('data-type');
                const val = btn.getAttribute('data-val');
                document.querySelectorAll(`button[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (type === 'current') currentDir = val;
                if (type === 'field') fieldDir = val;
                calculatePhysics();
            });
        });

        function calculatePhysics() {
            let forceDesc = "";
            if (currentDir === 'up') {
                if (fieldDir === 'left')  forceDesc = "Out of the Page / Forward";
                if (fieldDir === 'right') forceDesc = "Into the Page / Backward";
                if (fieldDir === 'into')  forceDesc = "Left";
                if (fieldDir === 'out')   forceDesc = "Right";
            } else {
                if (fieldDir === 'left')  forceDesc = "Into the Page / Backward";
                if (fieldDir === 'right') forceDesc = "Out of the Page / Forward";
                if (fieldDir === 'into')  forceDesc = "Right";
                if (fieldDir === 'out')   forceDesc = "Left";
            }
            forceText.textContent = forceDesc;
            draw(forceDesc);
        }

        function drawSymbol(x, y, type, color) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.stroke();

            if (type === 'into') {
                ctx.beginPath();
                ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6);
                ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6);
                ctx.stroke();
            } else if (type === 'out') {
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawArrow(x1, y1, x2, y2, color) {
            ctx.lineWidth = 5;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - 12 * Math.cos(angle - Math.PI/6), y2 - 12 * Math.sin(angle - Math.PI/6));
            ctx.lineTo(x2 - 12 * Math.cos(angle + Math.PI/6), y2 - 12 * Math.sin(angle + Math.PI/6));
            ctx.fill();
        }

        function draw(forceDesc) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = 200, cy = 200;

            // Draw Wire
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#45475a';
            ctx.beginPath(); ctx.moveTo(cx, 40); ctx.lineTo(cx, 360); ctx.stroke();

            // Draw Current
            if (currentDir === 'up') drawArrow(cx, 280, cx, 120, '#f38ba8');
            else drawArrow(cx, 120, cx, 280, '#f38ba8');

            // Draw Magnetic Field
            const bColor = '#89b4fa';
            if (fieldDir === 'left') {
                drawArrow(cx + 100, cy - 40, cx - 100, cy - 40, bColor);
                drawArrow(cx + 100, cy + 40, cx - 100, cy + 40, bColor);
            } else if (fieldDir === 'right') {
                drawArrow(cx - 100, cy - 40, cx + 100, cy - 40, bColor);
                drawArrow(cx - 100, cy + 40, cx + 100, cy + 40, bColor);
            } else {
                drawSymbol(cx - 70, cy - 50, fieldDir, bColor);
                drawSymbol(cx + 70, cy - 50, fieldDir, bColor);
