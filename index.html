<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 950px;
            width: 100%;
        }

        .panel {
            background-color: #242434;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex: 1;
            min-width: 300px;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background-color: #3b3b4f;
            color: white;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        button:hover {
            background-color: #4c4c6d;
        }

        button.active {
            background-color: #007acc;
            border-color: #00bfff;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background-color: #111116;
            border-radius: 6px;
            border-left: 5px solid #2ecc71;
        }

        .output-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .output-text {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        .display-window {
            background-color: #111116;
            border: 2px solid #3b3b4f;
            border-radius: 8px;
            width: 450px;
            height: 450px;
            position: relative;
            overflow: hidden;
        }

        /* Central Wire Container */
        .wire-container {
            position: absolute;
            left: 50%;
            top: 5%;
            width: 24px;
            height: 90%;
            transform: translateX(-50%);
            overflow: hidden; /* Clips the infinite moving arrows */
            z-index: 2;
        }

        .wire-core {
            position: absolute;
            top: 0;
            left: 6px;
            width: 12px;
            height: 100%;
            background-color: #7f8c8d;
            border-radius: 4px;
        }

        /* Continuous Flowing Current Animation */
        .current-stream {
            position: absolute;
            width: 100%;
            height: 200%; /* Extra height to cycle seamlessly */
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .current-arrow {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
        }

        .current-arrow.up {
            border-bottom: 25px solid #e74c3c;
        }

        .current-arrow.down {
            border-top: 25px solid #e74c3c;
        }

        @keyframes flowUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes flowDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* Grid Layer for Dense Field Lines */
        .field-grid {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 90%;
            height: 80%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            z-index: 1;
            pointer-events: none;
        }

        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pure CSS Field Line Symbols */
        .field-symbol {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
            opacity: 0.8;
        }

        /* Moving Arrow Field Lines for Left/Right */
        .field-line-row {
            position: absolute;
            width: 90%;
            left: 5%;
            height: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1;
        }

        .field-arrow {
            font-size: 22px;
            font-weight: bold;
            color: #3498db;
        }

        @keyframes shiftLeft {
            0% { transform: translateX(20px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(-20px); opacity: 0; }
        }

        @keyframes shiftRight {
            0% { transform: translateX(-20px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(20px); opacity: 0; }
        }

        .animate-left { animation: shiftLeft 1.5s infinite linear; }
        .animate-right { animation: shiftRight 1.5s infinite linear; }

        /* Force Feedback Overlays */
        .force-overlay {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 3;
            pointer-events: none;
        }

        .visual-badge {
            font-weight: bold;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .badge-current { background-color: #e74c3c; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 4;}
    </style>
</head>
<body>

    <h1>Magnetic Force</h1>

    <div class="container">
        <!-- Dashboard Control Box -->
        <div class="panel">
            <div class="group">
                <label>1. Current Direction (I)</label>
                <div class="buttons">
                    <button class="active" onclick="updateCurrent('up', this)">↑ UP (Flowing)</button>
                    <button onclick="updateCurrent('down', this)">↓ DOWN (Flowing)</button>
                </div>
            </div>

            <div class="group">
                <label>2. Magnetic Field Direction (B)</label>
                <div class="buttons">
                    <button class="active" onclick="updateField('left', this)">← LEFT</button>
                    <button onclick="updateField('right', this)">→ RIGHT</button>
                    <button onclick="updateField('into', this)">⊗ INTO PLANE</button>
                    <button onclick="updateField('out', this)">⊙ OUT OF PLANE</button>
                </div>
            </div>

            <div class="output">
                <div class="output-title">Direction of Force (F)</div>
                <div class="output-text" id="forceResult">Out of the Page / Forward</div>
            </div>
        </div>

        <!-- Safe Graphic Viewport -->
        <div class="display-window">
            <div class="visual-badge badge-current">Wire: Current (I)</div>
            
            <!-- Central Physical Wire Module -->
            <div class="wire-container">
                <div class="wire-core"></div>
                <div id="streamBox" class="current-stream" style="animation: flowUp 1.2s infinite linear;">
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                </div>
            </div>

            <!-- Heavy Field Vectors Layers -->
            <div id="fieldMatrix"></div>

            <!-- Resulting Force Presentation Layer -->
            <div id="forceFeedback" class="force-overlay"></div>
        </div>
    </div>

    <script>
        let currentDir = 'up';
        let fieldDir = 'left';

        function updateCurrent(dir, btn) {
            currentDir = dir;
            clearActive(btn);
            
            const streamBox = document.getElementById('streamBox');
            // Rebuild the arrows dynamically inside the flowing stream
            if (dir === 'up') {
                streamBox.style.animation = 'flowUp 1.2s infinite linear';
                streamBox.innerHTML = `
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                    <div class="current-arrow up"></div>
                `;
            } else {
                streamBox.style.animation = 'flowDown 1.2s infinite linear';
                streamBox.innerHTML = `
                    <div class="current-arrow down"></div>
                    <div class="current-arrow down"></div>
                    <div class="current-arrow down"></div>
                    <div class="current-arrow down"></div>
                    <div class="current-arrow down"></div>
                `;
            }
            runPhysics();
        }
