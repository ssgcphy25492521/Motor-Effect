<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 0 0 20px 0;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        .panel {
            background-color: #242434;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
        }

        .group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #3b3b4f;
            color: white;
            border: 2px solid #007acc;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background-color: #111116;
            border-radius: 6px;
            border-left: 5px solid #2ecc71;
        }

        .output-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .output-text {
            font-size: 20px;
            font-weight: bold;
            color: #2ecc71;
        }

        canvas {
            background-color: #111116;
            border: 2px solid #3b3b4f;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Magnetic Force</h1>

    <div class="container">
        <!-- Control Interface Panel -->
        <div class="panel">
            <div class="group">
                <label for="currentSelect">1. Current Direction (I):</label>
                <select id="currentSelect">
                    <option value="up" selected>↑ UP (Flowing)</option>
                    <option value="down">↓ DOWN (Flowing)</option>
                </select>
            </div>

            <div class="group">
                <label for="fieldSelect">2. Magnetic Field Direction (B):</label>
                <select id="fieldSelect">
                    <option value="left" selected>← LEFT</option>
                    <option value="right">→ RIGHT</option>
                    <option value="into">⊗ INTO PLANE</option>
                    <option value="out">⊙ OUT OF PLANE</option>
                </select>
            </div>

            <div class="output">
                <div class="output-title">Direction of Force (F) in Words</div>
                <div class="output-text" id="forceResult">Out of the Page / Forward</div>
            </div>
        </div>

        <!-- Render Target Canvas Window -->
        <canvas id="simCanvas" width="500" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const currentSelect = document.getElementById('currentSelect');
        const fieldSelect = document.getElementById('fieldSelect');

        // Continuous particle step index
        let animationOffset = 0;

        function drawVectorArrow(x1, y1, x2, y2, color, thickness = 4) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = thickness;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Mathematically precise arrowhead rendering
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const headLength = thickness * 3;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6));
            ctx.fill();
        }

        function drawSymbolMarker(x, y, mode, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.stroke();

            if (mode === 'into') {
                ctx.beginPath();
                ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6);
                ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6);
                ctx.stroke();
            } else {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animationLoop() {
            // Step particle positions forward sequentially
            animationOffset += 1.5;
            if (animationOffset > 100) animationOffset = 0;

            const currentDir = currentSelect.value;
            const fieldDir = fieldSelect.value;
            
            // Clean view screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // --- 1. RENDER MAGNETIC FIELD (B) MATRIX ---
            const bColor = '#3498db';
            if (fieldDir === 'left' || fieldDir === 'right') {
                const shift = (fieldDir === 'left') ? -(animationOffset % 40) : (animationOffset % 40);
                // Render horizontal field stream blocks
                for (let y = 50; y < canvas.height; y += 80) {
                    for (let x = -40; x < canvas.width + 40; x += 100) {
                        // Avoid rendering text vectors directly over the physical wire center line
                        if (Math.abs((x + shift) - cx) > 30) {
                            if (fieldDir === 'left') {
                                drawVectorArrow(x + shift + 40, y, x + shift, y, bColor, 2.5);
                            } else {
                                drawVectorArrow(x + shift, y, x + shift + 40, y, bColor, 2.5);
                            }
                        }
                    }
                }
            } else {
                // Render static point cross/dot matrix blocks around wire coordinates
                for (let x = 60; x < canvas.width; x += 110) {
                    for (let y = 60; y < canvas.height; y += 90) {
                        if (Math.abs(x - cx) > 40) {
                            drawSymbolMarker(x, y, fieldDir, bColor);
                        }
                    }
                }
            }

            // --- 2. RENDER THE PHYSICAL CONDUCTOR WIRE (I) ---
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 14;
            ctx.lineCap = "square";
            ctx.beginPath();
            ctx.moveTo(cx, 20);
            ctx.lineTo(cx, canvas.height - 20);
            ctx.stroke();

            // Render current flow dots tracing along the vertical vector track line
            ctx.fillStyle = '#ffffff';
            for (let y = 0; y < 5; y++) {
                let dotY;
                if (currentDir === 'up') {
                    dotY = (canvas.height - 40) - ((y * 100 + animationOffset * 2) % (canvas.height - 40));
                } else {
                    dotY = 40 + ((y * 100 + animationOffset * 2) % (canvas.height - 40));
                }
                ctx.beginPath();
                ctx.arc(cx, dotY, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- 3. EVALUATE RIGHT-HAND RULE PHYSICS MATRIX ---
            let forceDesc = "";
            if (currentDir === 'up') {
                if (fieldDir === 'left')  forceDesc = "Out of the Page / Forward";
                if (fieldDir === 'right') forceDesc = "Into the Page / Backward";
                if (fieldDir === 'into')  forceDesc = "Left";
                if (fieldDir === 'out')   forceDesc = "Right";
            } else {
                if (fieldDir === 'left')  forceDesc = "Into the Page / Backward";
                if (fieldDir === 'right') forceDesc = "Out of the Page / Forward";
                if (fieldDir === 'into')  forceDesc = "Right";
                if (fieldDir === 'out')   forceDesc = "Left";
            }
            document.getElementById('forceResult').textContent = forceDesc;

            // --- 4. RENDER FORCE (F) ARROW GRAPHIC OVERLAY ---
            const fColor = '#2ecc71';
            ctx.shadowBlur = 10;
            ctx.shadowColor = fColor;

            if (forceDesc === "Left") {
                drawVectorArrow(cx, cy, cx - 140, cy, fColor, 7);
            } else if (forceDesc === "Right") {
                drawVectorArrow(cx, cy, cx + 140, cy, fColor, 7);
            } else if (forceDesc.includes("Into the Page")) {
                // Visualizing 3D vectors via concentric incoming layers
                ctx.strokeStyle = fColor;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(cx, cy, 35, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 20, cy - 20); ctx.lineTo(cx + 20, cy + 20);
